<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ chatbot_name }}</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --panel:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --user:#2563eb; --border:#2c3038; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:14px 16px; border-bottom:1px solid var(--border); background:var(--panel); font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
  .sources { margin-top:8px; font-size:12px; color:var(--muted); }
  .hint { color:var(--muted); text-align:center; margin-top:20vh; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); background:var(--panel); }
  .inner { display:flex; gap:8px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:10px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
</style>
</head>
<body>
<header>{{ chatbot_name }}</header>
<main id="log"><p class="hint" id="hint">Ask a question about the documents.</p></main>
<form id="form">
  <div class="inner">
    <input id="q" maxlength="500" placeholder="Type your question..." autocomplete="off" autofocus aria-label="Question">
    <button id="send">Send</button>
  </div>
</form>
<script>
  const log = document.getElementById('log'), form = document.getElementById('form');
  const input = document.getElementById('q'), send = document.getElementById('send');

  function add(cls, text) {
    document.getElementById('hint')?.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    add('user', question);
    input.value = '';
    send.disabled = true;
    const bot = add('bot', 'Thinking...');
    try {
      const res = await fetch('{% url "chatbot-ask" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      bot.textContent = res.status === 429 ? 'Too many requests, please wait a moment.' : (data.answer || data.detail || 'No answer.');
      const sources = [...new Set((data.matches || []).map(m => m.source))].slice(0, 5);
      if (sources.length) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.textContent = 'Sources: ' + sources.join(', ');
        bot.appendChild(s);
      }
    } catch (err) {
      bot.textContent = 'Could not reach the server.';
    } finally {
      send.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  });
</script>
</body>
</html>
